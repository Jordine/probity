  <g id="text_31">
   <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #475360" x="31.752" y="53.198203" transform="rotate(-0 31.752 53.198203)">Cached agreement does not measure generation noise</text>
  </g>
  <g id="text_32">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #475360" transform="translate(31.752 428.785312)">Native Qwen: cached repeats only; fresh-repeat variability unmeasured. Opus: no repeated identical prompts.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #475360" transform="translate(31.752 441.502813)">Haiku calls span Anthropic/Azure routes without fingerprints. This measures routing/runtime variability, not isolated sampling noise.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #475360" transform="translate(31.752 454.220312)">Pairs within a prompt group overlap; the two rates are descriptive summaries, not independent trials or confidence intervals.</text>
  </g>
